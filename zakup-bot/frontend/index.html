<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Заявки на закуп</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg: #f4f4f2;
        --surface: #ffffff;
        --border: #e2e0da;
        --text: #1c1c1a;
        --text-secondary: #6b6a64;
        --accent: #185fa5;
        --accent-bg: #e6f1fb;
        --success: #3b6d11;
        --success-bg: #eaf3de;
        --warning: #854f0b;
        --warning-bg: #faeeda;
        --danger: #a32d2d;
        --danger-bg: #fcebeb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #root { max-width: 480px; margin: 0 auto; min-height: 100vh; }
      button {
        font-family: inherit;
        cursor: pointer;
        border-radius: 8px;
      }
      input, select, textarea {
        font-family: inherit;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
